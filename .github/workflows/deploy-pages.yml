name: Deploy to GitHub Pages

on:
  push:
    branches:
      - Claud-V2-REFACTOR
      - claud-V2
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure Pages
        # enablement: true turns on GitHub Pages for the repo on first run, so
        # no manual repo-settings step is required.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare environment
        # Mainnet config is hard-coded in src/utils/networkHelpers.js, so the
        # in-app network switcher works out of the box. .env.dist supplies the
        # testnet endpoints; HashRouter keeps deep links working on Pages.
        run: |
          cp .env.dist .env
          echo "REACT_APP_USE_HASH_ROUTER=true" >> .env

      - name: Build
        env:
          PUBLIC_PATH: /liberland_frontend/
          REACT_APP_USE_HASH_ROUTER: 'true'
          NODE_OPTIONS: --max-old-space-size=4096
        run: node_modules/.bin/webpack --mode=production

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
